plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '1.0.17'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'SkydeityMysticPivot'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// ★ 第 60 批：源码是 UTF-8（注释与字符串字面量里全是中文），而 Windows 简中环境下
//   javac 的默认源码编码是 GBK ⇒ 每遇一个中文字符就报
//   "unmappable character for encoding GBK"，并且把 case "乾" 这类中文标签搅成
//   两只相同的乱码标签，进而误报 "case 标签重复"（一次编译 101 个错误，其实全是这一条病因）。
//   显式钉死 UTF-8 后，上述报错整体消失。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly files(parent_api)
    // Only for compiling the InfusionMatrixBlockEntity accessor mixin; never bundled (compileOnly).
    compileOnly files(parent_runtime)
    // 配方查看器适配（JEI / EMI）仅在编译期参与（compileOnly），运行时为可选前置：
    // 未安装时对应插件类不会被加载。两个 jar 放在 deps/ 里，版本须与玩家 mods 里的一致。
    compileOnly fileTree(dir: 'deps', include: ['*.jar'])
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

// ★ 第 143 批曾在这里挂一个 copyToMods 任务，把 build 产物自动复制进本机客户端的 mods 目录。
//   第 220 批按用户要求整段移除：build 只产出 build/libs/ 下的 jar，不再写入任何游戏目录。
