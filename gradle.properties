# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.248
neo_version_range=[21.1.248,)
loader_version_range=[1,)

# Mod identity
mod_id=skydeitymysticpivot
mod_name=Thaumcraft Skydeity Mystic Pivot
mod_license=MIT
mod_version=0.1.0
mod_group_id=skydeity.mysticpivot
mod_authors=skydeity

# Sole compile dependency: the parent mod's public API jar.
# ★ 本体参考料整棵树在 .none/（不进 git）。第 196 批换 20751；第二百零八批用户把快照换成
#   **20753**（.none/1.21.1-neoforge-20753-dev-revealing-abilities-snapshot，旧的 20751 目录已删，
#   快照里同时带 fm / nm / tb / te / tm / tt / wt 七个附属的 sources，本 mod 一个都不依赖）：
#   相对 20744 的公开 API 差异（javap 全量签名 diff）**只有新增，没有删除**：
#     · 新增类 9 个：EssentiaStorageView、WandClientStages$BeamId、VisChange{Plan,Request,
#       Result,Settlement}、WandVisStages{,$Change,$Committed}；WandApi 新增 changeVis 一族；
#     · **EssentiaMultiStoreView 的父接口从 AspectContainerView 换成 EssentiaStorageView**
#       —— 这是唯一一条「会改行为」的差异：本体给所有 BlockEntityType 注册了
#       essentia_storage 能力，凡 instanceof EssentiaStorageView 就暴露，
#       于是本 mod 的源质罐**自动**有了本体的 Jade 存储段（见 README §12.196）。
parent_api=.none/1.21.1-neoforge-20753-dev-revealing-abilities-snapshot/tc/thaumcraft-neoforge-4.2.3.5-1.21.1-port.0.1.0-20753-api.jar
# Compile-only reference of the parent's implementation classes: used by the six
# accessor/invoker mixins (InfusionMatrixBlockEntity, ArcanePedestalBlockEntity,
# AuraNodeBlock, AuraNodeRenderer, TaintSpreadLogic, PlayerWarp — see README 12.12).
# ★ 20753 的运行时 jar 同样放在快照根目录（不像 20744/20748 放在 tc/ 里），
#   19 MB / 两千多个实现类；六个 mixin 目标类的成员签名已在该 jar 上重新 javap 核对。
#   它只进编译类路径、永不打包；mixin 全部 remap=false 按名字找目标。
parent_runtime=.none/1.21.1-neoforge-20753-dev-revealing-abilities-snapshot/thaumcraft-neoforge-4.2.3.5-1.21.1-port.0.1.0-20753.jar
