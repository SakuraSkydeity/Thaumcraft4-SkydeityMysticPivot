# Sole compile dependency: the parent mod's public API jar.
# ★ 本体参考料整棵树在 .none/（不进 git）。20746（2026-10-21 用户更新 dev 快照）：
#   相对 20744 的公开 API 差异极小（见 README-tc 12.149.1）：
#     · WandClientStages.Beam 新增首参 operation(BeamId)，配 BeamId 记录（effectId/owner/hand）；
#     · Bolt / Presentation / WandCastStages.Origin 各加一个带 operation 的重载；
#     · Thaumonomicon 视图新增 back()。
#   本 mod 未触及这几处，故源码无需改动，只是把依赖口径推到 20746。
parent_api=.none/1.21.1-neoforge-20746-dev/tc/thaumcraft-neoforge-4.2.3.5-1.21.1-port.0.1.0-20746-api.jar
# Compile-only reference of the full parent jar: only used by the single accessor mixin
# that targets InfusionMatrixBlockEntity (see README 12.12 for why it is needed).
parent_runtime=.none/1.21.1-neoforge-20746-dev/tc/thaumcraft-neoforge-4.2.3.5-1.21.1-port.0.1.0-20746.jar
