modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''神秘时代:天神玄枢 —— Thaumcraft Skydeity Mystic Pivot
An addon built against the parent mod's public API. The parent mod is required at runtime.'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="thaumcraft"
type="required"
versionRange="[4,)"
ordering="AFTER"
side="BOTH"

# JEI 为可选前置：安装后可在 JEI 中把玄枢炎炉当作烧炼工作台，查到它的烧炼表。
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="AFTER"
    side="CLIENT"

# EMI 为可选前置：安装后可在 EMI 中把玄枢炎炉当作烧炼工作台。
[[dependencies.${mod_id}]]
    modId="emi"
    type="optional"
    versionRange="[1.1,)"
    ordering="AFTER"
    side="CLIENT"
